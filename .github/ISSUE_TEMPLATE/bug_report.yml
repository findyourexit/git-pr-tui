name: Bug Report
description: Report a bug or unexpected behaviour in gprr
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `gprr ...`
        2. Press '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: view
    attributes:
      label: View
      description: Which view were you in when the bug occurred?
      options:
        - Dashboard
        - PR list
        - PR detail (Conversation / Files / Checks / Commits)
        - Diff viewer
        - Command palette / action menu
        - Composer
        - Other / not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 15.1, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal Emulator
      placeholder: e.g. Ghostty, iTerm2, Alacritty, Windows Terminal
    validations:
      required: false

  - type: input
    id: gprr-version
    attributes:
      label: gprr Version
      description: Output of `gprr --version`
    validations:
      required: false

  - type: input
    id: gh-version
    attributes:
      label: gh CLI Version
      description: Output of `gh --version`
    validations:
      required: false

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: Output of `rustc --version` (if you built from source)
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or config snippets that might help.
    validations:
      required: false
