# cross-rs configuration used by the release workflow's Linux cross-compiles.
#
# gpr unifies its TLS/crypto stack on aws-lc-rs (see Cargo.toml). The underlying
# aws-lc-sys crate compiles its C sources with CMake, which is not present in the
# default `cross` build images. Install it in the build container before each
# target build so the cross-compiled Linux binaries link successfully.
#
# AWS_LC_SYS_PREBUILT_NASM only matters on Windows MSVC, but passing it through
# keeps a single env surface across every release target.
[build.env]
passthrough = ["AWS_LC_SYS_PREBUILT_NASM"]

[target.x86_64-unknown-linux-gnu]
pre-build = ["apt-get update && apt-get install --assume-yes cmake"]

[target.aarch64-unknown-linux-gnu]
pre-build = ["apt-get update && apt-get install --assume-yes cmake"]
