query DetailCommitsPage(
  $owner: String!
  $name: String!
  $number: Int!
  $after: String
) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      commits(first: 50, after: $after) {
        pageInfo { hasNextPage endCursor }
        nodes {
          commit {
            oid
            messageHeadline
            authoredDate
            pushedDate
            author { user { login } }
          }
        }
      }
    }
  }
}
